{% extends "base.html" %}

{% block title %}Supprimer {{ student }}{% endblock %}

{% block content %}
    <section class="panel">
        <h1>Supprimer {{ student }} ?</h1>
        <p>Cette action est définitive : la fiche sera effacée de la base.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button button-danger">Oui, supprimer</button>
            <a class="button button-secondary" href="{% url 'students:detail' student.id %}">Annuler</a>
        </form>
    </section>
{% endblock %}
